<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mayya's Work Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Pacifico&family=Great+Vibes&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=La+Belle+Aurore&family=Special+Elite&family=Ultra&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --blob:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><path d='M50 4c7 0 11 3 17 4 6 2 12 5 15 11 4 5 9 9 10 16 1 6-1 11 0 17-1 7-5 12-9 17-4 6-8 11-15 14-6 3-12 6-19 6s-12-2-18-5c-6-3-12-6-16-12-4-5-8-10-9-17-1-6 1-12 2-18 1-6 4-11 8-15 4-5 9-9 15-12 6-3 12-4 19-4z'/></svg>");
  --card:#efe3c8;--ink:#2c160b;--ink2:#6e5a48;--wax:#8a1f24;--blue:#25345a;
  --spring:cubic-bezier(.34,1.4,.64,1);--travel:cubic-bezier(.5,0,.2,1);
  --type:'Special Elite',ui-monospace,monospace;--fell:'IM Fell English',serif;--fellsc:'IM Fell English SC',serif;--hand:'Homemade Apple',cursive;--pen:'La Belle Aurore',cursive;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .22 0 0 0 0 .12 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --fibre:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .55' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .16 0 0 0 .5 -.12'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.004 .09' numOctaves='4' seed='12' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .16 0 0 0 0 .08 0 0 0 0 .03 0 0 0 1.1 -.35'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
  --deckle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200' preserveAspectRatio='none'><filter id='d' x='-5%' y='-5%' width='110%' height='110%'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='3'/><feDisplacementMap in='SourceGraphic' scale='3.2'/></filter><rect x='2.5' y='2.5' width='295' height='195' fill='black' filter='url(%23d)'/></svg>");
}
*{box-sizing:border-box}
html,body{margin:0;background:#1d120b}
body{color:var(--ink);font:400 16px/1.5 var(--fell)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed #f3d9a8;outline-offset:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01s!important;animation-duration:.01s!important;animation-iteration-count:1!important}}

/* ================= THE TABLE ================= */
.tb{position:relative;width:100%;max-width:1600px;margin:0 auto;aspect-ratio:16/11;min-height:680px;overflow:hidden;container-type:inline-size;touch-action:pan-y;background:#2a1a10;
  --wallH:56%}
.tb::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--noise);opacity:.3;mix-blend-mode:overlay;z-index:90}
/* retro wallpaper */
.wall{position:absolute;left:0;right:0;top:0;height:var(--wallH);overflow:hidden;
  background:
    radial-gradient(ellipse 60% 80% at 50% 20%,rgba(255,250,236,.45),transparent 70%),
    radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(140,110,70,.18)),
    repeating-linear-gradient(0deg,rgba(150,125,90,.07) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(0deg,rgba(255,252,240,.18) 0 1px,transparent 1px 7px),
    #e9dfcb}
.wall::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='l'><feTurbulence type='fractalNoise' baseFrequency='.004 .9' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .36 0 0 0 0 .22 0 0 0 .55 -.12'/></filter><rect width='100%' height='100%' filter='url(%23l)'/></svg>"),var(--noise);opacity:.55;mix-blend-mode:multiply}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4.5%;background:linear-gradient(#b98b4e,#8f6331);box-shadow:0 -2px 0 rgba(255,236,190,.5),0 6px 14px rgba(40,20,5,.5)}
/* soft-UI (neumorphic) pieces sitting on the wall */
.neu{background:#e3cf9f;border-radius:18px;box-shadow:9px 9px 18px rgba(130,95,40,.5),-8px -8px 16px rgba(255,248,222,.75),inset 1px 1px 0 rgba(255,250,232,.6)}
.neu-in{box-shadow:inset 5px 5px 10px rgba(130,95,40,.45),inset -5px -5px 10px rgba(255,248,222,.7)}
.hoop{position:absolute;left:3%;top:6%;width:17%;aspect-ratio:1.55;z-index:2;filter:drop-shadow(7px 12px 10px rgba(80,50,15,.45))}
.hoop .ring{position:absolute;inset:0;border-radius:50%;padding:4.2%;
  background:radial-gradient(ellipse at 38% 28%,#f0c88e,#c48e55 45%,#8a5a2e 80%,#6e4423);
  box-shadow:inset 0 0 0 1.5px rgba(255,236,200,.55),inset 0 -3px 6px rgba(60,30,10,.55),inset 0 3px 4px rgba(255,236,200,.4)}
.hoop .ring::before{content:"";position:absolute;inset:2.2%;border-radius:50%;box-shadow:0 0 0 1.5px rgba(80,45,15,.55),inset 0 0 0 1px rgba(255,230,190,.35);pointer-events:none}
.hoop .emb{display:block;width:100%;height:100%;border-radius:50%}
.hoop .fab{position:absolute;inset:4.2%;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 10px rgba(90,60,25,.5),inset 0 0 2px rgba(60,35,10,.6);background:radial-gradient(ellipse at 35% 25%,rgba(255,255,250,.25),transparent 55%)}
.hoop .clamp{position:absolute;left:50%;top:-5.5%;width:11%;height:11%;translate:-50% 0;border-radius:3px;background:linear-gradient(90deg,#7a5a20,#f0d48c 45%,#8a6428);box-shadow:0 2px 3px rgba(40,20,5,.5)}
.hoop .clamp::after{content:"";position:absolute;left:50%;top:-55%;width:42%;aspect-ratio:1;translate:-50% 0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fbe7a8,#a87e30 60%,#5a4012)}
.hoop .nail{position:absolute;left:50%;top:-14%;width:6px;height:6px;translate:-50% 0;border-radius:50%;background:#3a2a1a;box-shadow:0 1px 1px rgba(255,255,255,.4)}
.plaque{position:absolute;left:3.5%;top:12%;width:17%;padding:1.4cqw 1.4cqw 1.2cqw;text-align:center;color:#5a3a1a;z-index:2}
.plaque b{display:block;font:clamp(14px,1.6cqw,26px)/1 var(--fellsc);letter-spacing:.12em;color:#4a2c14;text-shadow:1px 1px 0 rgba(255,248,222,.8),-1px -1px 0 rgba(120,80,30,.35)}
.plaque span{display:block;margin-top:.6cqw;font:clamp(8px,.72cqw,11px)/1.5 var(--type);letter-spacing:.18em;text-transform:uppercase;color:#7a5a30}
.plaque i{display:block;width:40%;height:3px;margin:.8cqw auto;border-radius:3px}
.clock{position:absolute;right:5%;top:12%;width:9%;aspect-ratio:1;border-radius:50%;z-index:2}
.clock .face{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,#f3e6c4,#e0cb98)}
.clock .tick{position:absolute;left:50%;top:6%;width:2px;height:8%;background:#5a3a1a;transform-origin:50% 550%;translate:-50% 0}
.clock .h,.clock .m,.clock .s2{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:2px;translate:-50% 0}
.clock .h{width:4px;height:24%;background:#3a2410}.clock .m{width:3px;height:34%;background:#3a2410}.clock .s2{width:1.5px;height:36%;background:var(--wax)}
.clock .dot{position:absolute;left:50%;top:50%;width:8%;aspect-ratio:1;border-radius:50%;background:var(--wax);translate:-50% -50%}
.clock small{position:absolute;left:0;right:0;top:64%;text-align:center;font:clamp(6px,.55cqw,9px)/1 var(--type);letter-spacing:.2em;color:#7a5a30}
/* cork board in a soft wooden frame */
.board{position:absolute;left:26%;top:3.5%;width:58%;height:89%;padding:1.1cqw;border-radius:22px;z-index:3;
  background:linear-gradient(145deg,#d7ab72,#b7854c);
  box-shadow:16px 18px 30px rgba(90,60,25,.55),-10px -10px 22px rgba(255,246,220,.7),inset 2px 2px 3px rgba(255,236,200,.7),inset -3px -3px 6px rgba(90,55,20,.5)}
.cork{position:relative;width:100%;height:100%;border-radius:12px;overflow:visible;
  background:
    radial-gradient(circle,rgba(90,55,20,.55) .9px,transparent 1.4px) 0 0/7px 9px,
    radial-gradient(circle,rgba(240,200,140,.5) .8px,transparent 1.3px) 3px 4px/11px 7px,
    radial-gradient(circle,rgba(70,40,15,.4) 1.4px,transparent 2px) 5px 2px/17px 13px,
    var(--noise),
    linear-gradient(135deg,#c4955c,#b0824c);
  box-shadow:inset 6px 6px 12px rgba(60,35,10,.55),inset -4px -4px 10px rgba(255,226,180,.35)}
.pin{position:absolute;left:50%;top:-.5cqw;width:clamp(10px,1.1cqw,18px);aspect-ratio:1;translate:-50% 0;border-radius:50%;z-index:5;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0 12%,var(--pc,#b8322c) 30%,color-mix(in srgb,var(--pc,#b8322c) 55%,#000) 100%);
  box-shadow:2px 4px 3px rgba(40,20,5,.45)}
.wall-hint{position:absolute;z-index:7;font:clamp(11px,1.05cqw,16px)/1.3 var(--hand);color:#f3e2bf;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;transition:opacity .5s}
.wall-hint svg{position:absolute;overflow:visible}.wall-hint path{fill:none;stroke:#f3e2bf;stroke-width:1.5;stroke-linecap:round}
/* the table */
.table{position:absolute;left:0;right:0;top:var(--wallH);bottom:0}
.table .tt{position:absolute;inset:0 0 9% 0;
  background:
    linear-gradient(rgba(20,10,4,.55),transparent 18%),
    radial-gradient(ellipse 60% 80% at 50% 0%,rgba(255,215,150,.22),transparent 70%),
    repeating-linear-gradient(0deg,transparent 0 calc(25% - 2px),rgba(30,15,5,.5) calc(25% - 2px) 25%),
    var(--grain),
    linear-gradient(#7c5636,#6d4a2e 40%,#5f3f26)}
.table .tedge{position:absolute;left:0;right:0;bottom:0;height:9%;background:linear-gradient(#4a301c,#2e1c10);box-shadow:inset 0 2px 0 rgba(255,215,160,.35)}
.obj{position:absolute;left:var(--x);top:var(--y);width:var(--w);rotate:var(--r,0deg);z-index:var(--z,2);user-select:none;-webkit-user-drag:none;touch-action:none;
  transition:rotate .45s var(--spring),scale .3s var(--spring),filter .3s}
.obj.drag{cursor:grab}
.obj.is-drag{cursor:grabbing;scale:1.04;rotate:calc(var(--r,0deg) * .3);filter:drop-shadow(0 30px 24px rgba(0,0,0,.45));transition:scale .3s,filter .3s}
.obj:not(.is-drag):hover{scale:1.02}
.sh{filter:drop-shadow(0 10px 10px rgba(10,5,0,.45)) drop-shadow(0 2px 2px rgba(10,5,0,.4))}
.hand{font-family:var(--hand)}

/* sticky note */
.note{background:#f4e9a8;padding:1.4cqw 1.5cqw 1.7cqw;color:#2a2550;font:clamp(11px,1.05cqw,17px)/1.55 var(--hand);
  box-shadow:inset 0 -20px 30px -24px rgba(120,90,0,.4)}
.note::before{content:"";position:absolute;left:50%;top:-10px;width:40%;height:20px;translate:-50% 0;rotate:-3deg;background:rgba(235,225,200,.7);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.note::after{content:"";position:absolute;inset:0;background:var(--noise);opacity:.3;mix-blend-mode:multiply;pointer-events:none}
.note b{display:block;font:clamp(22px,2.3cqw,38px)/1.1 var(--fell);font-style:italic;color:var(--ink);margin-bottom:.3em}
.note small{display:inline-block;margin-top:.7em;padding:.15em .45em;font:clamp(10px,.95cqw,15px)/1.4 var(--type);color:#3a2a0a;background:linear-gradient(transparent 12%,rgba(255,170,90,.55) 12% 88%,transparent 88%);rotate:-1deg}
.note .hl{background:linear-gradient(transparent 55%,rgba(255,150,140,.55) 55% 92%,transparent 92%);padding:0 .1em}

/* matcha */
.matcha{aspect-ratio:140/130}
.matcha svg{display:block;width:100%;height:100%;overflow:visible}
.steam{position:absolute;left:28%;top:-22%;width:40%;height:60%;pointer-events:none;opacity:.5}
.steam span{position:absolute;bottom:0;width:6px;height:40px;border-radius:50%;background:rgba(255,255,255,.4);filter:blur(4px);animation:steam 4s ease-in-out infinite}
.steam span:nth-child(2){left:40%;animation-delay:1.3s}.steam span:nth-child(3){left:75%;animation-delay:2.6s}
@keyframes steam{0%{transform:translateY(0) scaleX(1);opacity:0}30%{opacity:.8}100%{transform:translateY(-60px) scaleX(2.4);opacity:0}}

/* Minolta SR-T 101 (three.js) */
.cam3d{aspect-ratio:1.3;cursor:grab}
.cam3d.grab{cursor:grabbing}
.cam3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cam3d .csh{position:absolute;left:14%;right:10%;bottom:9%;height:20%;border-radius:50%;background:radial-gradient(ellipse,rgba(10,4,0,.55),transparent 70%);filter:blur(4px);pointer-events:none}
.cam3d .lbl{position:absolute;left:50%;top:2%;translate:-50% 0;white-space:nowrap;padding:6px 12px;border-radius:999px;background:#f3e6c6;color:#3a2410;font:clamp(9px,.8cqw,12px)/1 var(--type);
  box-shadow:4px 6px 10px rgba(20,10,4,.4);opacity:0;transition:opacity .25s;pointer-events:none}
.cam3d:hover .lbl{opacity:1}
.flash{position:absolute;inset:0;z-index:85;pointer-events:none;background:radial-gradient(circle at var(--fx,70%) var(--fy,65%),rgba(255,255,250,.95),rgba(255,250,235,.5) 30%,transparent 70%);opacity:0}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
/* pencil */
.pencil{height:1.1cqw;min-height:9px;border-radius:2px;background:linear-gradient(#e7b53c,#d79a22 50%,#b97c12);box-shadow:0 4px 5px rgba(0,0,0,.4)}
.pencil::before{content:"";position:absolute;right:100%;top:0;border-style:solid;border-width:calc(max(9px,1.1cqw)/2) 0 calc(max(9px,1.1cqw)/2) 2cqw;border-color:transparent transparent transparent transparent;
  border-right-color:#e8c99a;border-width:calc(max(9px,1.1cqw)/2) 2cqw calc(max(9px,1.1cqw)/2) 0}
.pencil::after{content:"";position:absolute;left:100%;top:0;width:1.6cqw;height:100%;border-radius:0 3px 3px 0;background:linear-gradient(#d8d8d0,#9a9a90 50%,#e3a3a3 50.5%,#c97a7a)}

/* ---------------- desk globe ---------------- */
.globe{aspect-ratio:1/1.3;cursor:grab}
.globe canvas{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;touch-action:none}
.globe .stem{position:absolute;left:46%;top:73%;width:8%;height:13%;border-radius:2px;background:linear-gradient(90deg,#6b4a1c,#d8b46a 40%,#8a6428);pointer-events:none}
.globe .base{position:absolute;left:22%;right:22%;top:83%;height:13%;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 45% 30%,#a8784a,#6e4a2c 60%,#3e2816);box-shadow:0 10px 16px rgba(10,5,0,.55),inset 0 -6px 8px rgba(0,0,0,.35),inset 0 3px 3px rgba(255,220,170,.35)}
.globe .base::after{content:"";position:absolute;left:12%;right:12%;top:12%;height:44%;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#c79a62,#8a6038)}
.lie{perspective:1100px;perspective-origin:50% -40%}
.lie>.lay3{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(56deg) rotateZ(var(--rz,0deg));transition:transform .5s var(--spring)}
.lie:not(.is-drag):hover{scale:1}
.lie .sh3{position:absolute;inset:4% 2% -4% 6%;border-radius:6%;background:rgba(10,4,0,.6);filter:blur(10px);transform:translateZ(-1px)}
/* passport: covers, page block, gilt stamping */
.ppc{aspect-ratio:.7;cursor:pointer;--t:max(7px,.6cqw)}
.bk-face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ppc .cb{inset:0;border-radius:4% 7% 7% 4%/3% 5% 5% 3%;background:#141c33}
.ppc .pg{left:1.5%;right:3.5%;top:2.5%;bottom:2.5%;background:#efe6cf;transform:translateZ(calc(var(--t)*.5))}
.ppc .ef{left:1.5%;right:3.5%;bottom:2.5%;height:var(--t);transform-origin:50% 100%;transform:translateZ(calc(var(--t)*.15)) rotateX(-90deg);
  background:repeating-linear-gradient(0deg,#f6efdc 0 1px,#d8caa8 1px 2px),#efe6cf;box-shadow:inset 0 0 6px rgba(120,90,40,.35)}
.ppc .er{right:3.5%;top:2.5%;bottom:2.5%;width:var(--t);transform-origin:100% 50%;transform:translateZ(calc(var(--t)*.15)) rotateY(90deg);
  background:repeating-linear-gradient(90deg,#f6efdc 0 1px,#cfc09c 1px 2px),#e8dec4}
.ppc .cbe{left:0;right:0;bottom:0;height:calc(var(--t)*.35);transform-origin:50% 100%;transform:rotateX(-90deg);background:#0e1528}
.ppc .cv{position:absolute;inset:0;border-radius:4% 7% 7% 4%/3% 5% 5% 3%;transform-origin:0 50%;transform:translateZ(var(--t));transition:transform .6s var(--spring);
  background:radial-gradient(ellipse 80% 60% at 30% 20%,rgba(255,255,255,.14),transparent 60%),linear-gradient(90deg,rgba(0,0,0,.35) 0 7%,rgba(255,255,255,.06) 8%,transparent 12%),linear-gradient(150deg,#2c3d68,#1b2644 60%,#141c33);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 -2px 3px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:14% 9%;color:#d8b46a}
.ppc .cv::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--noise),var(--fibre);opacity:.55;mix-blend-mode:overlay}
.ppc .cv b{font:clamp(8px,.85cqw,13px)/1 var(--fellsc);letter-spacing:.3em;color:#e3c27a;text-shadow:0 1px 0 rgba(0,0,0,.6),0 -1px 0 rgba(255,236,180,.35)}
.ppc .cv svg{width:52%;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6)) drop-shadow(0 -1px 0 rgba(255,236,180,.3))}
.ppc .cv small{font:clamp(6px,.55cqw,9px)/1.3 var(--type);letter-spacing:.2em;text-align:center;color:#c9a65e;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.ppc:hover .cv,.ppc:focus-visible .cv{transform:translateZ(var(--t)) rotateY(-18deg)}
.ppc:hover .lay3{transform:rotateX(52deg) rotateZ(var(--rz,0deg)) translateZ(6px)}
.globe canvas.spin{cursor:grabbing}
.globe .load{position:absolute;inset:0;display:grid;place-items:center;font:12px var(--type);color:#f3e2bf}
.scrib{position:absolute;z-index:40;pointer-events:none;font:clamp(12px,1.2cqw,18px)/1.3 var(--hand);color:#f6e7c4;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap;transition:opacity .5s}
.scrib svg{position:absolute;overflow:visible}
.scrib path{fill:none;stroke:#f6e7c4;stroke-width:1.6;stroke-linecap:round}

/* ---------------- passport ---------------- */
.pp{width:min(70cqw,880px);aspect-ratio:1.42;padding:.45cqw;position:relative;border-radius:1cqw;background:linear-gradient(135deg,#25345a,#1b2644);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.pp-in{position:relative;display:grid;grid-template-columns:1fr 1fr;height:100%;border-radius:.6cqw;overflow:hidden}
.pp-pg{position:relative;padding:7% 7% 6%;overflow:hidden;
  background:repeating-radial-gradient(circle at 80% 20%,transparent 0 9px,rgba(60,90,100,.08) 9px 10px),repeating-radial-gradient(circle at 10% 90%,transparent 0 12px,rgba(150,80,60,.07) 12px 13px),#f2e9d4}
.pp-pg::before{content:"";position:absolute;inset:0;background:var(--fibre),var(--noise);opacity:.45;mix-blend-mode:multiply;pointer-events:none}
.pp-pg:first-child{box-shadow:inset -14px 0 16px -12px rgba(60,35,10,.5)}
.pp-pg:last-child{box-shadow:inset 14px 0 16px -12px rgba(60,35,10,.5)}
.pp-h{position:relative;font:clamp(8px,.7cqw,11px)/1 var(--type);letter-spacing:.25em;color:var(--ink2);display:flex;justify-content:space-between}
.pp-city{position:relative;margin-top:6%;font:italic clamp(16px,1.9cqw,30px)/1 var(--fell)}
.pp-when{position:relative;font:clamp(9px,.85cqw,13px)/1.4 var(--type);color:var(--ink2);margin-top:3px}
.pp-cap{position:relative;margin-top:4%;font:clamp(11px,1.05cqw,16px)/1.35 var(--pen);color:#23324f}
.pp-st{position:relative;width:48%;margin-top:6%}
.pp-st .st{width:100%}
.pp-visas{position:relative;display:grid;gap:clamp(6px,.9cqw,14px);margin-top:6%}
.pp-nav{position:absolute;right:4%;bottom:4%;display:flex;gap:6px;z-index:3}

.pp-nav button:active{box-shadow:inset 3px 3px 6px rgba(90,60,25,.45),inset -3px -3px 6px rgba(255,250,235,.85)}
.pp-empty{position:relative;margin-top:10%;font:clamp(10px,.95cqw,14px)/1.5 var(--pen);color:var(--ink2)}
.visa{position:relative;justify-self:start;max-width:100%;padding:6% 7% 5%;color:var(--vc,#24507f);rotate:var(--r);
  border:2px solid currentColor;border-radius:5px;filter:url(#inky);animation:thump .55s var(--spring) both;animation-delay:calc(var(--d) * 140ms + 200ms)}
.visa::before{content:"";position:absolute;inset:3px;border:1px solid currentColor;border-radius:3px;opacity:.7}
.visa .row{display:flex;align-items:center;gap:8px}
.visa .lg{flex:none;width:clamp(20px,2cqw,30px);aspect-ratio:1;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font:clamp(9px,.8cqw,12px)/1 var(--fellsc);background:center/70% no-repeat}

@keyframes thump{0%{scale:1.7;opacity:0}55%{opacity:1}100%{scale:1;opacity:1}}
.journey{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:2.5cqw;align-items:center;width:min(92cqw,1240px)}
.j-globe{position:relative;aspect-ratio:1/1.3}
.j-globe .globe{position:absolute!important;left:0!important;top:0!important;width:100%!important;rotate:0deg!important}

@media (max-width:760px){.journey{grid-template-columns:1fr;width:94vw;max-height:86vh;overflow:auto}.j-globe{width:62%;margin:0 auto}}
.zoom .pp-city{font-size:clamp(22px,2.7cqw,42px)}.zoom .pp-when{font-size:clamp(11px,1.1cqw,16px)}.zoom .pp-cap{font-size:clamp(15px,1.6cqw,24px)}
.zoom .pp-h{font-size:clamp(9px,.85cqw,13px)}.zoom .visa b{font-size:clamp(14px,1.55cqw,24px)}.zoom .visa small{font-size:clamp(10px,1cqw,15px)}.zoom .visa .lg{width:clamp(28px,2.8cqw,42px);font-size:clamp(11px,1.1cqw,16px)}
.zoom .pp-st{width:44%}.zoom .st-country{font-size:clamp(8px,.9cqw,13px)}.zoom .st-val{font-size:clamp(16px,1.9cqw,30px)}.zoom .st-city{font-size:clamp(8px,.85cqw,13px)}

/* ---------------- envelope on the table ---------------- */
.env{aspect-ratio:1.55;cursor:pointer}
.env-lie{aspect-ratio:1.55}
.env-lie .ev{position:absolute;inset:0;transform:translateZ(var(--z)) rotateZ(var(--er,0deg));transition:transform .5s var(--spring)}
.env-lie .ev svg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(20,8,0,.45))}
.env-lie .ev.top{--z:7px}
.env-lie:hover .ev.top{transform:translateZ(18px) rotateZ(-2deg) translateY(-3%)}
.env-lie:hover .peek{transform:translateZ(5px) translateY(-6%)}
.env-lie .peek{transform:translateZ(4px);transition:transform .5s var(--spring)}
.env-lie .seal3d{position:absolute;left:49.4%;top:56%;width:13%;aspect-ratio:1;translate:-50% -50%;transform-style:preserve-3d}
.env-lie .seal3d span{position:absolute;inset:0;transform:translateZ(var(--sz));-webkit-mask:var(--blob) center/100% 100%;mask:var(--blob) center/100% 100%;background:#2e1517}
.env-lie.unread{animation:envNudge 4s ease-in-out infinite}
@keyframes envNudge{0%,86%,100%{translate:0 0}90%{translate:0 -6px}94%{translate:0 0}97%{translate:0 -3px}}
.env-cta{position:absolute;left:50%;bottom:calc(100% + 14px);translate:-50% 0;z-index:30;white-space:nowrap;pointer-events:none;
  padding:10px 16px;border-radius:999px;background:#f3e6c6;color:#3a2410;font:clamp(11px,1cqw,15px)/1 var(--type);letter-spacing:.04em;
  box-shadow:6px 8px 14px rgba(20,10,4,.45);animation:ctaBob 2.4s ease-in-out infinite;transition:opacity .4s}
.env-cta b{font:clamp(14px,1.4cqw,20px)/1 var(--hand);font-weight:400;color:#8a1f24;margin-right:6px}
.env-cta::after{content:"";position:absolute;left:50%;top:100%;translate:-50% -1px;border:8px solid transparent;border-top-color:#f3e6c6}
@keyframes ctaBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.env-lie:not(.unread) .env-cta{opacity:0}
.env-lie .tw{position:absolute;background:repeating-linear-gradient(135deg,#e2cfa4 0 2px,#a88d58 2px 4px);box-shadow:0 1.5px 1.5px rgba(40,20,5,.55);transform:translateZ(9px)}
.env-lie .tw.h{left:-1.5%;right:-1.5%;top:76%;height:max(2.5px,.24cqw)}
.env-lie .tw.v{top:-2%;bottom:-2%;left:74%;width:max(2.5px,.24cqw)}
.env-lie .knot{position:absolute;left:74%;top:76%;width:9%;aspect-ratio:1.6;translate:-50% -50%;transform:translateZ(10px)}
.env-lie .knot i{position:absolute;top:10%;width:46%;height:70%;border:max(2.5px,.24cqw) solid #b99a62;border-radius:50%;box-shadow:0 1.5px 1.5px rgba(40,20,5,.5)}
.env-lie .knot i:first-child{left:2%;rotate:-25deg}.env-lie .knot i:nth-child(2){right:2%;rotate:25deg}
.env-lie .knot b{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8d6ac,#9a7e48)}
.env-lie .tagw{position:absolute;left:76.5%;top:70%;width:22%;aspect-ratio:1.9;transform-origin:0 50%;transform:translateZ(12px) rotateZ(16deg);transition:transform .5s var(--spring)}
.env-lie:hover .tagw{transform:translateZ(20px) rotateZ(10deg)}
.env-lie .tagw .tsh{display:none}
.env-lie .tagw .tg{position:absolute;inset:0;display:grid;place-items:center;padding-left:18%;
  clip-path:polygon(16% 0,100% 0,100% 100%,16% 100%,0 50%);
  background:radial-gradient(circle at 10% 50%,#4a2e16 0 4.5%,#c9a876 5% 8%,transparent 8.5%),linear-gradient(100deg,rgba(255,255,255,.25),transparent 40%,rgba(80,50,20,.18)),linear-gradient(160deg,#f0dcb0,#d2ae74);
  font:700 clamp(11px,1.25cqw,19px)/1 var(--pen);color:#1f2a44;filter:drop-shadow(1px 3px 2px rgba(30,12,2,.5))}
.env-lie .tagw .str{position:absolute;left:-4%;top:28%;width:16%;height:44%;border:max(2px,.2cqw) solid #b99a62;border-right:0;border-radius:50% 0 0 50%;background:none;box-shadow:-1px 1px 1px rgba(40,20,5,.35)}
.env-lie .seal3d svg{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(3px)}
.env svg.kr{position:absolute;inset:0;width:100%;height:100%}
.env svg.fl{position:absolute;inset:0;width:100%;height:100%}
.env .peek{position:absolute;left:12%;right:10%;top:-30%;height:52%}
.env .pk-ph{position:absolute;height:70%;aspect-ratio:3/2;background:var(--img) center/cover;box-shadow:0 2px 4px rgba(0,0,0,.35);border:2px solid #f6f2e8;filter:sepia(.15)}
.env .pk-lt{position:absolute;left:4%;right:2%;top:34%;height:80%;background:#f3ecdc;box-shadow:0 2px 4px rgba(0,0,0,.3);rotate:-1.5deg;
  padding:5% 6%;font:clamp(8px,.85cqw,13px)/1.5 var(--pen);color:#1f2a44;overflow:hidden;white-space:nowrap}
.env .pk-lt::after{content:"";position:absolute;inset:0;background:var(--fibre),var(--noise);opacity:.4;mix-blend-mode:multiply}
.env .seal{position:absolute;left:49.4%;top:56%;width:13%;translate:-50% -50%}
.env .seal svg{width:100%;display:block;filter:drop-shadow(0 2px 2px rgba(20,0,0,.45))}
.env .count{position:absolute;right:-6%;top:-10%;padding:5px 9px;border-radius:999px;background:var(--wax);color:#f6e7c4;font:clamp(10px,.9cqw,13px)/1 var(--type);rotate:8deg}
.env.ghost{opacity:.35}

/* ---------------- photo prints ---------------- */
.ph{cursor:grab}
.ph .pic,.bigph .pic{position:relative;overflow:hidden;background:#111}
.ph .pic i,.bigph .pic i{position:absolute;inset:0;background:var(--img) var(--pos,center)/cover;filter:var(--fx,sepia(.2) contrast(1.05) saturate(.9))}
.ph .pic::after,.bigph .pic::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(30,15,5,.35)),var(--noise);mix-blend-mode:multiply;opacity:.8}
.pol{background:#f6f2e8;padding:.7cqw .7cqw 0}
.pol .pic{aspect-ratio:1}
.pol figcaption{height:clamp(30px,3.4cqw,56px);display:grid;place-items:center;font:clamp(10px,1.05cqw,16px)/1 var(--pen);color:#23324f}
.pol::after,.film::after{content:"";position:absolute;inset:0;background:var(--noise);opacity:.25;mix-blend-mode:multiply;pointer-events:none}
.film{background:#fbf8f0;padding:.55cqw}
.film .pic{aspect-ratio:3/2}
.film figcaption{position:absolute;right:7%;bottom:7%;font:clamp(9px,.8cqw,12px)/1 var(--type);color:#ff9a3c;text-shadow:0 0 3px rgba(255,120,40,.8);letter-spacing:.1em}
.booth{background:#f6f2e8;padding:.45cqw .45cqw 1.2cqw}
.booth .pic{aspect-ratio:3/4;margin-bottom:6%}
.booth .pic:last-of-type{margin-bottom:0}
.tape{position:absolute;width:38%;height:clamp(12px,1.4cqw,22px);left:31%;top:-.7cqw;background:rgba(235,225,200,.65);rotate:-4deg;box-shadow:0 1px 2px rgba(0,0,0,.15);z-index:2}

/* ---------------- luggage tag + stickers ---------------- */
.tag{aspect-ratio:.6;cursor:pointer;perspective:900px;container-type:inline-size}
.tag::before{content:"";position:absolute;left:46%;top:-26%;width:2px;height:34%;background:#d9c7a0;rotate:24deg;transform-origin:bottom}
.tag-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s var(--spring)}
.tag.flip .tag-in{transform:rotateY(180deg)}
.tag-f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#f1e3c0;color:#3a2418;
  clip-path:polygon(22% 0,78% 0,100% 13%,100% 100%,0 100%,0 13%);padding:36% 8% 10%;display:flex;flex-direction:column;align-items:center;text-align:center;
  box-shadow:inset 0 0 0 3px #f1e3c0,inset 0 0 0 4px #a5543a}
.tag-f::before{content:"";position:absolute;left:50%;top:9%;width:17%;aspect-ratio:1;translate:-50% 0;border-radius:50%;background:#5a3c26;box-shadow:0 0 0 4px #c9a86a}
.tag-f::after{content:"";position:absolute;inset:0;background:var(--noise);opacity:.3;mix-blend-mode:multiply;pointer-events:none}
.tag .s{font:7.5cqw/1.3 var(--type);letter-spacing:.12em;text-transform:uppercase;opacity:.75;white-space:nowrap}
.tag .n{font:9.6cqw/1.45 var(--hand);margin:6% 0;white-space:nowrap}
.tag .m{font:italic 15cqw/1 var(--fell);margin-top:auto}
.tag-b{transform:rotateY(180deg);background:#3a2418;color:#f1e3c0;box-shadow:none;padding-top:34%}
.tag-b a{display:block;width:100%;margin-top:7%;padding:7% 2%;border-radius:999px;background:#f1e3c0;color:#3a2418;text-decoration:none;font:8.5cqw/1 var(--type);letter-spacing:.1em;text-transform:uppercase}
.tag-b a.alt{background:transparent;color:#f1e3c0;box-shadow:inset 0 0 0 1px #f1e3c0}
.stk{display:grid;place-items:center;text-align:center;text-decoration:none;color:var(--fg,#f6ecd6);background:var(--bg);width:auto;cursor:grab;
  padding:clamp(6px,.8cqw,12px) clamp(10px,1.2cqw,18px);box-shadow:0 0 0 clamp(2px,.3cqw,4px) #f6ecd6,0 6px 8px -3px rgba(0,0,0,.5)}
.stk span{display:block;pointer-events:none}
.stk .t{font:clamp(6px,.6cqw,9px)/1.3 var(--type);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.stk .b{font:clamp(11px,1.25cqw,19px)/1 Ultra,serif}
.stk .i{font:italic clamp(13px,1.4cqw,21px)/1 var(--fell)}
.stk .h{font:clamp(9px,.9cqw,13px)/1.3 var(--hand)}
.stk.ov{border-radius:50%;padding-inline:clamp(14px,1.6cqw,24px)}
.stk.rc{border-radius:5px}
.stk.bn{clip-path:polygon(0 0,100% 0,93% 50%,100% 100%,0 100%,7% 50%);padding-inline:clamp(16px,1.8cqw,26px);box-shadow:none}

/* ================= ZOOM (pick something up) ================= */
.zoom{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:rgba(18,9,4,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s}
.zoom.on{opacity:1;pointer-events:auto}
.zoom-x{position:absolute;right:2.4%;top:3%;z-index:5;border:0;cursor:pointer;padding:12px 18px;min-height:44px;border-radius:999px;background:#e3cf9f;color:var(--ink);font:13px/1 var(--type);box-shadow:6px 6px 12px rgba(20,10,4,.55),-4px -4px 10px rgba(255,240,205,.25),inset 1px 1px 0 rgba(255,250,232,.6)}
.zoom-x:active{box-shadow:inset 4px 4px 8px rgba(110,80,40,.5),inset -4px -4px 8px rgba(255,248,222,.6)}
.zoom-hint{position:absolute;left:50%;bottom:3.5%;translate:-50% 0;font:clamp(12px,1.2cqw,17px)/1 var(--hand);color:#f6e7c4;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.zoom-body{position:relative;transform:scale(.9) translateY(20px);transition:transform .5s var(--spring)}
.zoom.on .zoom-body{transform:none}

/* big photo (flip) */
.bigph{width:min(56cqw,80vh);perspective:1600px;cursor:pointer}
.bigph-in{position:relative;transform-style:preserve-3d;transition:transform .9s var(--spring)}
.bigph.flip .bigph-in{transform:rotateY(180deg)}
.bigph .ff{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bigph .bb{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#f3ead6;padding:10%;display:flex;flex-direction:column;justify-content:center;gap:4%;
  box-shadow:inset 0 0 30px rgba(130,85,35,.35)}
.bigph .bb::after{content:"";position:absolute;inset:0;background:var(--fibre),var(--noise);opacity:.5;mix-blend-mode:multiply;pointer-events:none}
.bigph .bb p{margin:0;font:clamp(18px,2.4cqw,34px)/1.35 var(--pen);color:#23324f}
.bigph .bb small{font:clamp(10px,1cqw,14px)/1.4 var(--type);color:var(--ink2);letter-spacing:.08em}

/* ================= LETTER (inside zoom) ================= */
.pc-stage{--W:min(520px,46cqw,62vh);position:relative;width:var(--W);height:calc(var(--W)*1.24)}
.pc-env{position:absolute;left:0;top:calc(var(--W)*.6);width:100%;height:calc(var(--W)*.64);perspective:1400px;rotate:-2deg}
.pc-env-back{position:absolute;inset:0;width:100%;height:100%;z-index:1;filter:drop-shadow(0 26px 22px rgba(0,0,0,.45))}
.pc-pocket{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.pc-flap{position:absolute;left:0;top:0;width:100%;height:60%;z-index:4;transform-origin:50% 0;transition:transform 1s var(--travel);transform-style:preserve-3d}
.pc-flap svg{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(30,15,5,.3))}
.letter.is-flapback .pc-flap{z-index:1}
.letter.is-open .pc-flap{transform:rotateX(180deg)}
.pc-seal{position:absolute;z-index:5;left:50%;top:60%;width:calc(var(--W)*.12);aspect-ratio:1;translate:-50% -50%;border:0;padding:0;background:none;cursor:grab;touch-action:none;perspective:520px}
.pc-seal.peel{cursor:grabbing}
.pc-seal .res{position:absolute;inset:0;opacity:0;pointer-events:none;
  -webkit-mask:var(--blob) center/100% 100% no-repeat;mask:var(--blob) center/100% 100% no-repeat;
  background:radial-gradient(circle at 45% 45%,rgba(90,50,52,.35) 0 6%,transparent 7%) 0 0/9px 11px,
    var(--fibre),var(--noise),radial-gradient(circle,rgba(226,188,138,.85) 0 40%,rgba(214,170,118,.7) 60%,rgba(110,55,55,.28) 74%,rgba(80,35,38,.45) 81%,transparent 87%)}
.pc-seal .fly{position:absolute;inset:0;transform-style:preserve-3d}
.pc-seal .pr{position:absolute;inset:0}
.pc-seal .lay{position:absolute;inset:0}
.pc-seal .rot{position:absolute;inset:0;transform:rotate(var(--nphi,0rad))}
.pc-seal .stk .rot svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(20,0,0,.45))}
.pc-seal .und{-webkit-mask:var(--blob) center/100% 100% no-repeat;mask:var(--blob) center/100% 100% no-repeat;
  background:radial-gradient(ellipse 36% 32% at 50% 50%,rgba(208,164,112,.75),rgba(190,140,92,.35) 65%,transparent 100%),var(--fibre),linear-gradient(135deg,#5e3437,#40222a)}
.pc-seal .shade{position:absolute;inset:0;-webkit-mask:var(--blob) center/100% 100% no-repeat;mask:var(--blob) center/100% 100% no-repeat}
.pc-seal .fsh{filter:blur(3px);opacity:0}
.pc-seal .fsh .rot{-webkit-mask:var(--blob) center/100% 100% no-repeat;mask:var(--blob) center/100% 100% no-repeat;background:rgba(25,8,4,.55)}
.letter.is-open .pc-seal{pointer-events:none}
.letter.is-open .pc-seal .res{opacity:1}
@keyframes pc-wiggle{0%,80%,100%{rotate:0}84%{rotate:-8deg}88%{rotate:7deg}92%{rotate:-3deg}}
.pc-crumb{position:absolute;z-index:6;left:50%;top:60%;width:6px;height:5px;border-radius:2px;background:var(--wax);opacity:0;pointer-events:none}
.pc-crumb{display:none}
@keyframes crumb{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(200deg)}}
.pc-card{position:absolute;left:6%;top:calc(var(--W)*.03);width:88%;aspect-ratio:3/2;z-index:2;perspective:1600px;cursor:grab;touch-action:none;
  transition:translate 1.15s var(--travel),rotate .9s var(--spring),scale .5s var(--spring)}
.letter.is-rise .pc-card{translate:0 calc(var(--W)*-.64)}
.letter.is-rise .pc-card[data-pos="1"]{transition-delay:.1s}.letter.is-rise .pc-card[data-pos="2"]{transition-delay:.2s}
.letter.is-out .pc-card{translate:0 calc(var(--W)*-.53);transition-delay:0s}
.letter.is-out .pc-card[data-pos="0"]{z-index:9;rotate:-1.5deg}
.letter.is-out .pc-card[data-pos="1"]{z-index:8;rotate:4deg;translate:4% calc(var(--W)*-.555)}
.letter.is-out .pc-card[data-pos="2"]{z-index:7;rotate:-6deg;translate:-4% calc(var(--W)*-.57)}
.pc-tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg));transition:transform .5s var(--spring)}
.pc-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s var(--spring)}
.pc-card.is-flipped .pc-inner{transform:rotateY(180deg)}
.pc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:3px 5px 4px 6px/5px 3px 6px 4px;background:var(--card);box-shadow:0 1px 0 rgba(0,0,0,.08),0 22px 34px -18px rgba(0,0,0,.7)}
.pc-face::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,250,235,.35),transparent 40%),var(--fox,none),
    linear-gradient(103deg,transparent 61.6%,rgba(255,255,255,.28) 62%,rgba(90,60,25,.12) 62.25%,transparent 62.9%),var(--fibre),var(--noise);
  mix-blend-mode:multiply;opacity:.9}
.pc-face::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(110,70,30,.25),inset 0 0 22px rgba(130,85,35,.45),inset 0 0 3px rgba(90,55,20,.6)}
.pc-back{transform:rotateY(180deg)}

  el.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;if(handle&&!handle(e))return;
    active=true;moved=false;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{
    if(!active)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<5)return;
    if(!moved){moved=true;el.classList.add('is-drag');el.style.setProperty('--z',++topZ);}
    const P=el.parentElement,W=P.clientWidth,H=P.clientHeight;
    el.style.left=Math.max(-el.offsetWidth*.4,Math.min(W-el.offsetWidth*.6,ox+dx))/W*100+'%';
    el.style.top=Math.max(-el.offsetHeight*.3,Math.min(H-el.offsetHeight*.6,oy+dy))/H*100+'%';
  });
  const end=e=>{
    if(!active)return;active=false;el.classList.remove('is-drag');
    if(moved)el.style.setProperty('--r',(Math.random()*16-8).toFixed(1)+'deg');
    else if(onTap&&e.type==='pointerup')onTap(e);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();}},true);
}

/* phones: open on the glowing letter, then fade the swipe hint once they scroll */
(()=>{const sc=document.getElementById('tbScroll'),hint=document.getElementById('swipeHint');
  const center=()=>{if(sc.scrollWidth<=sc.clientWidth)return;sc.scrollLeft=Math.max(0,envEl.offsetLeft+envEl.offsetWidth/2-sc.clientWidth/2);};
  center();window.addEventListener('load',center);setTimeout(center,400);
  let n=0;sc.addEventListener('scroll',()=>{if(++n>3)hint.classList.add('gone');},{passive:true});
  setTimeout(()=>hint.classList.add('gone'),6000);})();
</script>
</body>
</html>
