<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library scene</title>
  <!-- Free fallback pixel font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="library-scene.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    body { display: grid; place-items: center; }
    .library-scene { width: 100%; }
  </style>
</head>
<body>
  <!-- Copy from here to embed in your portfolio -->
    <div class="library-scene" aria-label="Pixel-art library. Click Sumayya or the cat.">
      <picture>
        <source media="(max-width: 700px)" srcset="assets/library-scene-mobile.png">
        <img class="ls-bg" src="assets/library-scene.png" alt="" decoding="async">
      </picture>

      <!-- Sumayya -->
      <div class="ls-window ls-torso-window">
        <div class="ls-move ls-torso">
          <picture>
            <source media="(max-width: 700px)" srcset="assets/library-scene-mobile.png">
            <img src="assets/library-scene.png" alt="" decoding="async">
          </picture>

          <div class="ls-window ls-head-window">
            <div class="ls-move ls-head">
              <div class="ls-move ls-head-pose">
                <picture>
                  <source media="(max-width: 700px)" srcset="assets/library-scene-mobile.png">
                  <img src="assets/library-scene.png" alt="" decoding="async">
                </picture>
                <span class="ls-pupil ls-pupil-ld"></span>
                <span class="ls-pupil ls-pupil-ls"></span>
                <span class="ls-pupil ls-pupil-rd"></span>
                <span class="ls-pupil ls-pupil-rs"></span>
                <span class="ls-lid"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Cat -->
      <div class="ls-window ls-cat-window">
        <div class="ls-move ls-cat">
          <picture>
            <source media="(max-width: 700px)" srcset="assets/library-scene-mobile.png">
            <img src="assets/library-scene.png" alt="" decoding="async">
          </picture>

          <div class="ls-window ls-cat-head-window">
            <div class="ls-move ls-cat-head">
              <div class="ls-move ls-cat-head-pose">
                <picture>
                  <source media="(max-width: 700px)" srcset="assets/library-scene-mobile.png">
                  <img src="assets/library-scene.png" alt="" decoding="async">
                </picture>

                <div class="ls-window ls-ear-l-window">
                  <div class="ls-move ls-ear-l">
                    <picture>
                      <source media="(max-width: 700px)" srcset="assets/library-scene-mobile.png">
                      <img src="assets/library-scene.png" alt="" decoding="async">
                    </picture>
                  </div>
                </div>
                <div class="ls-window ls-ear-r-window">
                  <div class="ls-move ls-ear-r">
                    <picture>
                      <source media="(max-width: 700px)" srcset="assets/library-scene-mobile.png">
                      <img src="assets/library-scene.png" alt="" decoding="async">
                    </picture>
                  </div>
                </div>

                <span class="ls-cat-lid ls-cat-lid-l"></span>
                <span class="ls-cat-lid ls-cat-lid-r"></span>
              </div>
            </div>
          </div>

          <div class="ls-window ls-paw-l-window">
            <div class="ls-move ls-paw-l">
              <picture>
                <source media="(max-width: 700px)" srcset="assets/library-scene-mobile.png">
                <img src="assets/library-scene.png" alt="" decoding="async">
              </picture>
            </div>
          </div>
          <div class="ls-window ls-paw-r-window">
            <div class="ls-move ls-paw-r">
              <picture>
                <source media="(max-width: 700px)" srcset="assets/library-scene-mobile.png">
                <img src="assets/library-scene.png" alt="" decoding="async">
              </picture>
            </div>
          </div>
        </div>
      </div>

      <!-- Cat shadow -->
      <span class="ls-cat-shade ls-cat-cast" aria-hidden="true"></span>
      <span class="ls-cat-shade ls-cat-contact" aria-hidden="true"></span>

      <!-- Lights -->
      <div class="ls-lights" aria-hidden="true">
        <span class="ls-glow" style="--x:55.1%; --y:60.6%; --s:14%; --d:4.6s; --delay:-1s"></span>
        <span class="ls-glow" style="--x:21.4%; --y:28.6%; --s:7%;  --d:3.8s; --delay:-2.2s"></span>
        <span class="ls-glow" style="--x:76.7%; --y:28.6%; --s:7%;  --d:4.1s; --delay:-0.6s"></span>

        <span class="ls-star" style="--x:51.25%; --y:29.3%; --s:2.2%; --d:2.9s; --delay:-0.4s"></span>
        <span class="ls-star" style="--x:44.35%; --y:35.1%; --s:2.6%; --d:3.4s; --delay:-1.7s"></span>
        <span class="ls-star" style="--x:52.75%; --y:46.1%; --s:3.2%; --d:3.1s; --delay:-2.5s"></span>
        <span class="ls-star" style="--x:47.45%; --y:51.0%; --s:2.3%; --d:2.6s; --delay:-1.1s"></span>
        <span class="ls-star" style="--x:49.1%;  --y:51.85%; --s:1.2%; --d:2.2s; --delay:-0.9s"></span>
        <span class="ls-star" style="--x:49.55%; --y:43.1%; --s:1.0%; --d:2.4s; --delay:-1.9s"></span>
        <span class="ls-star" style="--x:48.3%;  --y:63.1%; --s:1.4%; --d:2.8s; --delay:-0.2s"></span>

        <span class="ls-star" style="--x:46.85%; --y:33.4%; --s:0.9%; --d:1.9s; --delay:-0.3s"></span>
        <span class="ls-star" style="--x:49.25%; --y:30.85%; --s:0.8%; --d:2.3s; --delay:-1.4s"></span>
        <span class="ls-star" style="--x:44.6%;  --y:39.1%; --s:0.9%; --d:2.1s; --delay:-0.8s"></span>
        <span class="ls-star" style="--x:45.7%;  --y:39.8%; --s:0.7%; --d:1.8s; --delay:-1.2s"></span>
        <span class="ls-star" style="--x:47.1%;  --y:42.55%; --s:0.8%; --d:2.5s; --delay:-2.0s"></span>
        <span class="ls-star" style="--x:50.15%; --y:44.1%; --s:0.8%; --d:2.0s; --delay:-0.5s"></span>
        <span class="ls-star" style="--x:52.0%;  --y:49.3%; --s:0.8%; --d:2.7s; --delay:-1.6s"></span>
        <span class="ls-star" style="--x:44.0%;  --y:56.5%; --s:0.8%; --d:2.2s; --delay:-0.7s"></span>
        <span class="ls-star" style="--x:45.6%;  --y:56.7%; --s:0.7%; --d:1.9s; --delay:-1.3s"></span>
        <span class="ls-star" style="--x:44.55%; --y:57.6%; --s:0.7%; --d:2.4s; --delay:-0.1s"></span>
        <span class="ls-star" style="--x:47.1%;  --y:59.45%; --s:0.8%; --d:2.1s; --delay:-1.8s"></span>
        <span class="ls-star" style="--x:47.2%;  --y:61.7%; --s:0.7%; --d:2.6s; --delay:-0.6s"></span>
        <span class="ls-star" style="--x:48.7%;  --y:62.9%; --s:0.9%; --d:2.3s; --delay:-1.0s"></span>

        <span class="ls-mote" style="--x:46.5%; --y:62%; --s:0.55%; --d:9s;  --delay:0s;   --dx:1.2cqw"></span>
        <span class="ls-mote" style="--x:49.5%; --y:56%; --s:0.45%; --d:11s; --delay:-4s;  --dx:0.6cqw"></span>
        <span class="ls-mote" style="--x:45.5%; --y:48%; --s:0.5%;  --d:10s; --delay:-7s;  --dx:1.5cqw"></span>
        <span class="ls-mote" style="--x:51.5%; --y:40%; --s:0.4%;  --d:12s; --delay:-2.5s; --dx:0.8cqw"></span>

        <span class="ls-focus ls-focus-girl"></span>
        <span class="ls-focus ls-focus-cat"></span>
      </div>

      <!-- Selection outlines -->
      <span class="ls-ring ls-ring-girl" aria-hidden="true"></span>
      <span class="ls-ring ls-ring-cat" aria-hidden="true"></span>
      <span class="ls-ring ls-ring-book" aria-hidden="true"></span>
      <span class="ls-arrow ls-arrow-book" aria-hidden="true"></span>
      <span class="ls-arrow ls-arrow-girl" aria-hidden="true"></span>

      <!-- Click targets -->
      <button class="ls-hit ls-hit-girl" type="button" aria-label="Say hi to Sumayya"></button>
      <button class="ls-hit ls-hit-cat" type="button" aria-label="Pet the cat"></button>
      <button class="ls-hit ls-hit-book" type="button" aria-label="Sign the guestbook"></button>

      <!-- Cat bubble -->
      <div class="ls-bubble" aria-live="polite"><span class="ls-bubble-text">Meow!</span></div>


      <!-- Guestbook -->
      <div class="ls-gb" role="dialog" aria-label="Guestbook" aria-hidden="true">
        <div class="ls-gb-art"></div>
        <div class="ls-gb-inner">
          <p class="ls-gb-title">Leave a note</p>
          <label class="ls-gb-namewrap"><input class="ls-gb-name" type="text" maxlength="28" placeholder="your name" autocomplete="name"></label>
          <textarea class="ls-gb-msg" maxlength="320" placeholder="write something..." rows="4"></textarea>
        </div>
        <div class="ls-gb-press" aria-hidden="true"></div>
        <p class="ls-gb-hint">feather to write, stamp to sign</p>
        <div class="ls-gb-stamp-mark" aria-live="polite"><span class="ls-wax-text"></span></div>
        <button class="ls-gb-tool ls-gb-feather" type="button" aria-label="Write a note"></button>
        <button class="ls-gb-tool ls-gb-stamp" type="button" aria-label="Stamp and send"></button>
        <button class="ls-gb-nav ls-gb-prev" type="button" aria-label="Previous page"></button>
        <button class="ls-gb-nav ls-gb-next" type="button" aria-label="Next page"></button>
        <span class="ls-gb-folio" aria-hidden="true"></span>
        <div class="ls-gb-leaf" aria-hidden="true"></div>
        <button class="ls-gb-close" type="button" aria-label="Close guestbook">&times;</button>
      </div>

      <!-- Letter -->
      <div class="ls-dim"></div>
      <div class="ls-letter" role="dialog" aria-label="A note from Sumayya" aria-hidden="true">
        <div class="ls-scroll-host"></div>
        <p class="ls-letter-text" data-text="Oh.. Hi there! I'm Sumayya. I can help you by designing a fun experience. Find out about me in Sumayya's Room."></p>
        <div class="ls-quill" aria-hidden="true"></div>
        <button class="ls-close" type="button" aria-label="Close note">&times;</button>
      </div>
    </div>
    <script src="library-scene.js"></script>
    <!-- End embed -->
</body>
</html>
