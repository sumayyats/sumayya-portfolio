[build]
  command = "npm run build"
  publish = ".next"

# The Next runtime owns the functions pipeline, so this has to be named
# explicitly — left to the default it was never picked up and the endpoint
# 404ed while the rest of the site deployed fine.
[functions]
  directory = "netlify/functions"

# Netlify auto-detects Next.js, but pinning the plugin keeps builds reproducible.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The library scene is a standalone static page under public/.
# Next.js does not resolve a directory to its index.html, so map it explicitly
# — this makes /library work as well as /library/index.html.
# Next.js does not resolve a directory to its index.html, and it 308s
# "/library/" back to "/library", which then 404s. Both spellings are mapped
# here so the scene is reachable however it is typed.
[[redirects]]
  from = "/library"
  to = "/library/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/library/"
  to = "/library/index.html"
  status = 200
  force = true

# Deliberately no framing headers on /library.
#
# An allowlist cannot work here: Readymag renders a Code widget inside its own
# sandboxed iframe, so the scene's parent chain is an opaque origin that no
# frame-ancestors list can match. ("X-Frame-Options: ALLOWALL" was wrong too —
# the only valid values are DENY and SAMEORIGIN, so it either did nothing or
# blocked outright.) Sending nothing leaves the page embeddable anywhere, which
# is right for a public portfolio hero with no sensitive content.

# Fingerprinted-by-content, never-changing art and audio.
[[headers]]
  for = "/library/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
